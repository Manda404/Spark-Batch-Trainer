name: Code quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.3

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      - name: Check formatting
        run: poetry run black --check src utils tests

      - name: Lint
        run: poetry run ruff check src utils tests docs/source/conf.py

      - name: Check types
        run: poetry run mypy src

      - name: Build documentation
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: poetry run sphinx-build -W --keep-going -b html docs/source docs/build/html
