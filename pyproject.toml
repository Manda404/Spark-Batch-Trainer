[project]
name = "spark-batch-trainer"
version = "1.0.0"
description = "Modular and extensible framework for batch-wise model training with Spark, XGBoost, CatBoost, LightGBM."
authors = [{ name = "Manda Surel", email = "s239150.eps@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyspark>=4.0.1,<5.0.0",
    "xgboost>=3.0.5,<4.0.0",
    "catboost>=1.2.8,<2.0.0",
    "lightgbm>=4.6.0,<5.0.0",
    "pandas>=2.3.2,<3.0.0",
    "numpy>=2.3.2,<3.0.0",
    "scikit-learn>=1.7.2,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
]

[tool.poetry]
packages = [
    { include = "spark_batch_trainer", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
mypy = "^1.18.2"
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
seaborn = "^0.13.2"
notebook = "^7.4.6"
ruff = "^0.13.2"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:jupyter_client.connect",
]
