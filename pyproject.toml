[tool.poetry]
name = "spark-batch-trainer"
version = "1.0.0"
description = "Modular and extensible framework for batch-wise model training with Spark, XGBoost, CatBoost, LightGBM."
authors = ["Manda Surel <s239150.eps@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "spark_batch_trainer", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pyspark = ">=4.0.1,<5.0.0"
xgboost = ">=3.0.5,<4.0.0"
catboost = ">=1.2.8,<2.0.0"
lightgbm = ">=4.6.0,<5.0.0"
pandas = ">=2.3.2,<3.0.0"
numpy = ">=2.3.2,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^25.9.0"
isort = "^6.0.1"
mypy = "^1.18.2"
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
scikit-learn = "^1.7.2"
seaborn = "^0.13.2"
plotly = "^6.3.0"
nbformat = "^5.10.4"
ipywidgets = "^8.1.7"
notebook = "^7.4.6"
ruff = "^0.13.2"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:jupyter_client.connect",
]
